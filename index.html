<title>Safeer Khan — Photography</title>
<meta name="description" content="Street and landscape photography by Safeer Khan.">
<link rel="stylesheet" href="style.css">
<script>
  /* Set theme before first paint to avoid a flash of the wrong color. */
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

    <h1>Safeer Khan</h1>
    <p>Street and landscape photography</p>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
</header>

<main class="gallery" id="gallery">

  <!--
    ADDING A PHOTO:
    1. Drop the file into images/gallery/ (lowercase, hyphenated filename).
    2. Copy one <a class="photo">...</a> block below and update src/href, width, height, and alt.
    3. Commit and push. That's it — no build step, no manifest.

    ALT TEXT:
    Derived from the filename by convention (e.g. coast-at-dusk-01.jpg -> "Coast at dusk").
    Override it by hand here whenever the auto-derived text isn't good enough.

    To swap a placeholder for a real photo, change the src/href from
    "images/placeholder/placeholder-01.jpg" to "images/gallery/your-photo-name.jpg"
    and update width/height to match the real image's pixel dimensions.
  -->
