<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safeer Khan — Photography</title>
<meta name="description" content="Street and landscape photography by Safeer Khan.">
<link rel="stylesheet" href="style.css">
<script>
  /* Set theme before first paint to avoid a flash of the wrong color. */
  (function () {
    var saved = localStorage.getItem("theme");
    var theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
</head>
<body>

<header class="site-header">
  <div class="title">
    <h1>Safeer Khan</h1>
    <p>Moments frozen in time. My photography and travel journal.</p>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark</button>
</header>

<main class="categories" id="categories">

  <!--
    ADDING A GALLERY:
    1. Drop a new folder into images/gallery/ (e.g. images/gallery/Japan).
    2. Copy tools/resize.sh or manually add web-ready photos to it.
    3. Copy one <a class="category-card"> block below, point it at a
       new page (e.g. japan.html), and use the folder's first photo
       as the thumbnail.
    4. Copy italy.html to japan.html and update the title/photo blocks
       to match the new folder's images.
  -->

  <a class="category-card" href="italy.html">
    <img src="images/gallery/Italy/Italy_29.jpeg" alt="Italy" width="1500" height="2000" loading="lazy">
    <span class="category-label">Italy</span>
  </a>

  <a class="category-card" href="iceland.html">
    <img src="images/gallery/Iceland/iceland_19.jpeg" alt="Iceland" width="1536" height="2048" loading="lazy">
    <span class="category-label">Iceland</span>
  </a>

</main>

<footer class="site-footer">
  <a href="mailto:thesafeerkhan@gmail.com">thesafeerkhan@gmail.com</a>
  <!-- Add social links here, e.g.: <a href="https://instagram.com/yourhandle">Instagram</a> -->
</footer>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox-close" id="lightbox-close" type="button" aria-label="Close">&times;</button>
  <img id="lightbox-img" src="" alt="">
</div>

<script src="script.js" defer></script>
</body>
</html>
